<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pipone — Fotografi & Sajak</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      -webkit-font-smoothing: antialiased;
    }
    .filter-btn.active {
      text-decoration: underline;
      text-underline-offset: 6px;
      text-decoration-thickness: 1.5px;
    }
  </style>
</head>
<body id="body-root" class="bg-white text-neutral-900 dark:bg-neutral-950 dark:text-neutral-100 font-sans transition-colors duration-300">

  <!-- HEADER UTAMA ALA MARKENSON -->
  <header class="max-w-7xl mx-auto px-6 md:px-10 pt-10 pb-8 flex flex-col md:flex-row md:items-center justify-between gap-6 border-b border-neutral-200 dark:border-neutral-800">
    <div>
      <a href="#" onclick="filterCategory('All'); return false;" class="text-xl font-medium tracking-tight">
        Pipone Fotografie
      </a>
      <p class="text-xs text-neutral-500 dark:text-neutral-400 mt-0.5 font-mono">LOMBOK & SEKITARNYA</p>
    </div>

    <!-- Navigasi Kategori & Tombol Tema -->
    <div class="flex flex-wrap items-center justify-between md:justify-end gap-6 text-xs">
      <nav id="category-filters" class="flex flex-wrap items-center gap-5 text-neutral-500 dark:text-neutral-400">
        <button onclick="filterCategory('All')" class="filter-btn active hover:text-neutral-900 dark:hover:text-white transition-colors">Tout</button>
        <button onclick="filterCategory('Alam')" class="filter-btn hover:text-neutral-900 dark:hover:text-white transition-colors">Nature</button>
        <button onclick="filterCategory('Petualangan')" class="filter-btn hover:text-neutral-900 dark:hover:text-white transition-colors">Aventure</button>
        <button onclick="filterCategory('Urbain')" class="filter-btn hover:text-neutral-900 dark:hover:text-white transition-colors">Urbain</button>
        <button onclick="filterCategory('Sajak')" class="filter-btn hover:text-neutral-900 dark:hover:text-white transition-colors">Sajak & Kata</button>
      </nav>

      <!-- Tombol Switch Tema (Clair / Sombre) -->
      <button onclick="toggleTheme()" id="theme-toggle" class="font-mono text-[11px] border border-neutral-300 dark:border-neutral-700 px-3 py-1.5 rounded hover:border-neutral-900 dark:hover:border-white transition-colors">
        Sombre / Mode
